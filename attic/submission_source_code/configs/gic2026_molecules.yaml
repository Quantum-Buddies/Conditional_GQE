        - ["C", [1.212, -0.700, 0.000]]
        - ["C", [0.000, -1.400, 0.000]]
        - ["C", [-1.212, -0.700, 0.000]]
        - ["C", [-1.212, 0.700, 0.000]]
        - ["O", [2.420, 1.400, 0.000]]
        - ["H", [2.900, 2.200, 0.000]]
        - ["C", [-2.420, 1.400, 0.000]]
        - ["H", [-3.020, 1.000, 0.870]]
        - ["H", [-3.020, 1.000, -0.870]]
        - ["H", [-2.200, 2.400, 0.000]]
        - ["I", [0.000, 3.500, 0.000]]
        - ["H", [2.147, -1.240, 0.000]]
        - ["H", [0.000, -2.480, 0.000]]
        - ["H", [-2.147, -1.240, 0.000]]
      charge: 0
      multiplicity: 1
      split: "test"
      active_space:
        mode: "explicit"
        n_active_electrons: 4
        n_active_orbitals: 4

    - name: "phenol"
      geometry:
        - ["C", [0.000, 1.400, 0.000]]
        - ["C", [1.212, 0.700, 0.000]]
        - ["C", [1.212, -0.700, 0.000]]
        - ["C", [0.000, -1.400, 0.000]]
        - ["C", [-1.212, -0.700, 0.000]]
        - ["C", [-1.212, 0.700, 0.000]]
        - ["O", [2.420, 1.400, 0.000]]
        - ["H", [2.900, 2.200, 0.000]]
        - ["H", [2.147, -1.240, 0.000]]
        - ["H", [0.000, -2.480, 0.000]]
        - ["H", [-2.147, -1.240, 0.000]]
        - ["H", [-2.480, 1.240, 0.000]]
        - ["H", [0.000, 2.480, 0.000]]
      charge: 0
      multiplicity: 1
      split: "test"
      active_space:
        mode: "explicit"
        n_active_electrons: 4
        n_active_orbitals: 4

training:
  synthetic_samples: 256
  epochs: 5
  batch_size: 8
  learning_rate: 0.0005
  max_seq_len: 64
model:
  vocab_size: 149
  hidden_size: 256
  num_layers: 4
  dropout: 0.3
baselines:
  max_iterations: 150
  optimizer: "SLSQP"
