      charge: 0
      multiplicity: 1
      split: "train"
      active_space:
        mode: "explicit"
        n_active_electrons: 6
        n_active_orbitals: 6

    - name: "n2_1.1"
      geometry:
        - ["N", [0.0, 0.0, 0.0]]
        - ["N", [0.0, 0.0, 1.1]]
