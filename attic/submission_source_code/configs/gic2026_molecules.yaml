        - ["N", [0.0, 0.0, 0.0]]
        - ["N", [0.0, 0.0, 2.5]]
      charge: 0
      multiplicity: 1
      split: "val"
      active_space:
        mode: "explicit"
        n_active_electrons: 6
        n_active_orbitals: 6

    # === EUV photoresist molecules ===
    - name: "iodobenzene"
      geometry:
        - ["I", [3.500, 0.000, 0.000]]
        - ["C", [1.400, 0.000, 0.000]]
        - ["C", [0.700, 1.212, 0.000]]
        - ["C", [-0.700, 1.212, 0.000]]
        - ["C", [-1.400, 0.000, 0.000]]
        - ["C", [-0.700, -1.212, 0.000]]
