seed: 42
dataset:
  basis: "sto-3g"
  molecules:
    # === Core benchmark molecules ===
    - name: "h2"
      geometry:
        - ["H", [0.0, 0.0, 0.0]]
        - ["H", [0.0, 0.0, 0.74]]
      charge: 0
      multiplicity: 1
      split: "train"

    - name: "h2_0.74"
      geometry:
        - ["H", [0.0, 0.0, 0.0]]
        - ["H", [0.0, 0.0, 0.74]]
      charge: 0
      multiplicity: 1
      split: "train"

    - name: "h2_0.5"
      geometry:
        - ["H", [0.0, 0.0, 0.0]]
        - ["H", [0.0, 0.0, 0.5]]
      charge: 0
      multiplicity: 1
      split: "train"

    - name: "h2_1.0"
      geometry:
        - ["H", [0.0, 0.0, 0.0]]
        - ["H", [0.0, 0.0, 1.0]]
      charge: 0
      multiplicity: 1
      split: "train"

    - name: "h2_1.5"
      geometry:
        - ["H", [0.0, 0.0, 0.0]]
        - ["H", [0.0, 0.0, 1.5]]
      charge: 0
      multiplicity: 1
      split: "val"

    - name: "h2_2.0"
      geometry:
        - ["H", [0.0, 0.0, 0.0]]
        - ["H", [0.0, 0.0, 2.0]]
      charge: 0
      multiplicity: 1
      split: "val"

    - name: "lih"
      geometry:
        - ["Li", [0.0, 0.0, 0.0]]
        - ["H", [0.0, 0.0, 1.6]]
      charge: 0
      multiplicity: 1
      split: "train"
      active_space:
        mode: "explicit"
        n_active_electrons: 2
        n_active_orbitals: 4

    - name: "lih_1.6"
      geometry:
        - ["Li", [0.0, 0.0, 0.0]]
        - ["H", [0.0, 0.0, 1.6]]
      charge: 0
      multiplicity: 1
      split: "train"
      active_space:
        mode: "explicit"
        n_active_electrons: 2
        n_active_orbitals: 4

    - name: "lih_1.2"
      geometry:
        - ["Li", [0.0, 0.0, 0.0]]
        - ["H", [0.0, 0.0, 1.2]]
      charge: 0
      multiplicity: 1
      split: "train"
      active_space:
        mode: "explicit"
        n_active_electrons: 2
        n_active_orbitals: 4

    - name: "lih_2.0"
      geometry:
        - ["Li", [0.0, 0.0, 0.0]]
        - ["H", [0.0, 0.0, 2.0]]
      charge: 0
      multiplicity: 1
      split: "val"
      active_space:
        mode: "explicit"
        n_active_electrons: 2
        n_active_orbitals: 4

    - name: "lih_3.0"
      geometry:
        - ["Li", [0.0, 0.0, 0.0]]
        - ["H", [0.0, 0.0, 3.0]]
      charge: 0
      multiplicity: 1
      split: "val"
      active_space:
        mode: "explicit"
        n_active_electrons: 2
        n_active_orbitals: 4

    - name: "beh2"
      geometry:
        - ["Be", [0.0, 0.0, 0.0]]
